<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | gnkalgo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e7edf7;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,#12345b,#07111f 55%)}main{width:min(94%,500px);padding:30px;border:1px solid #264364;border-radius:18px;background:#0b192a}h1{margin-top:0}p{color:#9fb1c8}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #395571;border-radius:9px;background:#07111f;color:white}button{padding:12px 16px;border:0;border-radius:9px;background:#22c58b;font-weight:800;cursor:pointer}.secondary{background:#23415f;color:white}.row{display:flex;gap:8px}.row input{flex:1}.msg{min-height:24px;color:#ff9c9c}a{color:#64d8ff}</style></head><body><main><h1>Create your account</h1><p>Mobile verification is required before the account is created.</p><form id="form"><label for="name">Name</label><input id="name" autocomplete="name" required minlength="2"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="mobile">Mobile in E.164 format</label><div class="row"><input id="mobile" type="tel" placeholder="+919876543210" required><button type="button" id="send" class="secondary">Send OTP</button></div><label for="otp">OTP</label><div class="row"><input id="otp" inputmode="numeric" autocomplete="one-time-code"><button type="button" id="verify" class="secondary">Verify</button></div><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><p>Use 12–128 characters with uppercase, lowercase and a number.</p><label for="admin">Admin bootstrap token (only for the admin email)</label><input id="admin" type="password" autocomplete="off"><button type="submit">Create account</button></form><p class="msg" id="msg" role="alert"></p><a href="/login">Already registered? Sign in</a></main><script>
let grant='';const m=document.querySelector('#msg');async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});return[r,await r.json()]};send.onclick=async()=>{m.textContent='Sending…';const[r,j]=await post('/api/v1/auth/otp/request',{mobile:mobile.value,purpose:'register'});m.textContent=r.ok?'OTP sent.':j.error||'Could not send OTP'};verify.onclick=async()=>{m.textContent='Verifying…';const[r,j]=await post('/api/v1/auth/otp/verify',{mobile:mobile.value,code:otp.value});if(r.ok){grant=j.mobileVerificationToken;m.textContent='Mobile verified.'}else m.textContent=j.error||'Verification failed'};form.onsubmit=async e=>{e.preventDefault();if(!grant){m.textContent='Verify your mobile first.';return}m.textContent='Creating…';const[r,j]=await post('/api/v1/auth/register',{displayName:name.value,email:email.value,password:password.value,mobileVerificationToken:grant,adminBootstrapToken:admin.value||undefined});if(!r.ok){m.textContent=j.error||'Registration failed';return}location.href='/account'};</script></body></html>
