<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | gnkalgo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e7edf7;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#12345b,#07111f 55%)}main{width:min(92%,430px);padding:32px;border:1px solid #264364;border-radius:18px;background:#0b192a;box-shadow:0 24px 60px #0008}h1{margin:0 0 8px}p{color:#9fb1c8}label{display:block;margin:18px 0 6px}input{width:100%;padding:13px;border:1px solid #395571;border-radius:9px;background:#07111f;color:white}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#22c58b;color:#04120d;font-weight:800;cursor:pointer}a{color:#64d8ff}.links{display:flex;justify-content:space-between;margin-top:20px}.msg{min-height:24px;color:#ff9c9c}</style></head><body><main><h1>Welcome to gnkalgo</h1><p>Sign in with your gnkalgo account.</p><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form><p class="msg" id="msg" role="alert"></p><div class="links"><a href="/create-account">Create account</a><a href="/forgot-password">Forgot password?</a></div></main><script>
const f=document.querySelector('#form'),m=document.querySelector('#msg');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Signing in…';const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok){m.textContent=j.error||'Sign-in failed';return}location.href='/account'});</script></body></html>
