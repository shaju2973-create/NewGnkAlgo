<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | gnkalgo</title><style>:root{font-family:Inter,system-ui;color:#e7edf7;background:#07111f}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(92%,650px);padding:32px;border:1px solid #264364;border-radius:18px;background:#0b192a}button,a{display:inline-block;margin:8px;padding:12px 16px;border:0;border-radius:8px;background:#22c58b;color:#04120d;font-weight:800;text-decoration:none;cursor:pointer}.danger{background:#ff7070}p{color:#a9bbcf}</style></head><body><main><h1>gnkalgo account</h1><p id="who">Checking session…</p><section id="content" hidden><h2>Connect a broker</h2><a href="/api/v1/auth/redirect/upstox">Upstox</a><a href="/api/v1/auth/redirect/zerodha">Zerodha</a><a href="/api/v1/auth/redirect/fyers">Fyers</a><a href="/api/v1/auth/redirect/dhan">Dhan</a><hr><button id="logout" class="danger">Sign out</button></section></main><script>async function load(){let r=await fetch('/api/v1/auth/me',{credentials:'same-origin'});if(r.status===401){const x=await fetch('/api/v1/auth/refresh',{method:'POST',credentials:'same-origin'});if(x.ok)r=await fetch('/api/v1/auth/me',{credentials:'same-origin'})}if(!r.ok){location.href='/login';return}const j=await r.json();who.textContent=`Signed in as ${j.user.email} (${j.user.role})`;content.hidden=false}logout.onclick=async()=>{await fetch('/api/v1/auth/logout',{method:'POST',credentials:'same-origin'});location.href='/login'};load();</script></body></html>
