<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | gnkalgo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e7edf7;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f}main{width:min(92%,450px);padding:32px;border:1px solid #264364;border-radius:18px;background:#0b192a}p{color:#9fb1c8}label{display:block;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #395571;border-radius:9px;background:#07111f;color:white}button{width:100%;padding:12px;margin-top:18px;border:0;border-radius:9px;background:#22c58b;font-weight:800;cursor:pointer}.msg{min-height:24px;color:#ffb0b0}a{color:#64d8ff}</style></head><body><main><h1>Reset password</h1><p>We send a code to the verified mobile connected to the account.</p><form id="request"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><button>Send reset code</button></form><form id="reset" hidden><label for="code">Reset code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" required><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><button>Set new password</button></form><p class="msg" id="msg" role="alert"></p><a href="/login">Return to sign in</a></main><script>
const m=document.querySelector('#msg');async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});return[r,await r.json()]};request.onsubmit=async e=>{e.preventDefault();const[r,j]=await post('/api/v1/auth/forgot-password',{email:email.value});m.textContent=j.message||j.error;reset.hidden=false};reset.onsubmit=async e=>{e.preventDefault();const[r,j]=await post('/api/v1/auth/reset-password',{email:email.value,code:code.value,newPassword:password.value});if(r.ok){m.textContent='Password changed. Redirecting…';setTimeout(()=>location.href='/login',1200)}else m.textContent=j.error||'Reset failed'};</script></body></html>
