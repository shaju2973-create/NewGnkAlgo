server {
    listen 80;
    listen [::]:80;
    server_name gnkalgo.com www.gnkalgo.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /health/live {
        proxy_pass http://app:3000/health/live;
        proxy_set_header Host $host;
    }
    location / { return 503; }
}
